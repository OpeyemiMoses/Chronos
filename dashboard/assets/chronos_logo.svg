    <circle cx="14" cy="14" r="10.5" stroke="#000000" stroke-width="1"/>
    <ellipse cx="14" cy="14" rx="9" ry="4" stroke="#00C853" stroke-width="1" transform="rotate(-30 14 14)"/>
